                <ul class="nav flex-column">

    <li class="nav-item">

        </a>
    </li>

    <li class="nav-item">
        <a href="tickets.html" class="nav-link">
            <i class="bi bi-ticket-perforated"></i> Tickets
        </a>
    </li>

    <li class="nav-item">
        <a href="departures.html" class="nav-link">
            <i class="bi bi-airplane-engines"></i> Departures
        </a>
    </li>

    <li class="nav-item">
        <a href="arrivals.html" class="nav-link">
            <i class="bi bi-airplane"></i> Arrivals
        </a>
    </li>

</ul>

            </div>
            <!-- ================= Sidebar End ================= -->


            <!-- ================= Main Content Start ================= -->
            <div class="col-md-9 main-content">

                <h2 class="mb-3">Dashboard</h2>

                <hr class="mb-4">

                <div class="row">

                    <!-- Card 1 -->
                    <div class="col-md-3 mb-4">
                        <div class="card shadow-sm">
                            <div class="card-body text-center">
    <i class="bi bi-airplane-engines fs-1 text-primary"></i>

    <h2>120</h2>
</div>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="col-md-3 mb-4">

    <h2>350</h2>
</div>
                        </div>
                    </div>

                    <!-- Card 3 -->
                    <div class="col-md-3 mb-4">

                        </div>
                    </div>

                    <div class="col-md-3 mb-4">
                        <div class="card shadow-sm">
                           <div class="card-body text-center">
    <i class="bi bi-box-arrow-in-down fs-1 text-danger"></i>

    <h2>18</h2>

                        </div>
                    </div>

                <h3 class="mb-3">Airport Overview</h3>

<div class="mb-4">
